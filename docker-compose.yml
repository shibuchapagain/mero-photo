version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:latest
    container_name: nest-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: construction-api
    volumes:
      - mongodb_data:/data/db
    restart: always

  # Redis Service
  redis:
    image: redis:latest
    container_name: nest-redis-server
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: always

volumes:
  redis_data:
  mongodb_data:
